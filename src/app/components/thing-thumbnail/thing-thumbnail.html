@if (imageUrl()) {
  <img [src]="imageUrl()" alt="" (load)="ready.emit()" (error)="markBroken(false)" />
} @else if (fallbackUrl(); as url) {
  <img [src]="url" alt="" (load)="ready.emit()" (error)="markBroken(true)" />
} @else if (showIcon()) {
  <ng-icon [name]="categoryIcon(category()?.icon)" aria-hidden="true" />
}
