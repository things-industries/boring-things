@if (!discovering() && (imageId() || category())) {
  <bt-thing-thumbnail
    class="hero-image"
    size="fill"
    [imageId]="imageId()"
    [category]="category()"
    (ready)="ready.set(true)"
  />
}
<div class="hero-scrim" aria-hidden="true"></div>
<div class="hero-content"><ng-content /></div>
