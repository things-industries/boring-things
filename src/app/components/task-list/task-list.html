<ul class="task-list">
  @for (item of items(); track item.key) {
    <li>
      <bt-task-card
        [item]="item"
        [now]="now()"
        [showDay]="showDay()"
        [inThing]="inThing()"
        (toggled)="actions.toggle(item)"
        (removed)="actions.remove(item)"
        (asked)="actions.ask(item)"
        (actionChosen)="actions.answer(item, $event)"
        (rescheduled)="actions.reschedule(item)"
      />
    </li>
  }
</ul>
