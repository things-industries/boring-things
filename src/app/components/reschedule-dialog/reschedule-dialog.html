<bt-dialog title="Edit schedule" [open]="!!task()" (closed)="close()">
  <form [id]="formId" class="reschedule-form" (ngSubmit)="save()">
    <h3 class="reschedule-task">{{ task()?.title }}</h3>
    <label class="reschedule-field"
      >Next due date
      <input
        name="date"
        type="date"
        required
        [ngModel]="date()"
        (ngModelChange)="date.set($event)"
      />
    </label>
    <label class="reschedule-field"
      >Repeat
      <select name="repeats" [ngModel]="repeats()" (ngModelChange)="repeats.set($event)">
        <option [ngValue]="false">No</option>
        <option [ngValue]="true">Yes</option>
      </select>
    </label>
    @if (repeats()) {
      <div class="reschedule-group" role="group" [attr.aria-labelledby]="formId + '-every'">
        <span class="reschedule-legend" [id]="formId + '-every'">Repeat every</span>
        <div class="reschedule-interval">
          <input
            name="interval"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            required
            aria-label="Number"
            [ngModel]="interval()"
            (ngModelChange)="interval.set($event)"
            (focus)="selectAll($event)"
            (click)="selectAll($event)"
          />
          <select
            name="unit"
            aria-label="Unit"
            [ngModel]="unit()"
            (ngModelChange)="unit.set($event)"
          >
            @for (option of units; track option) {
              <option [ngValue]="option">{{ unitOption(option) }}</option>
            }
          </select>
        </div>
      </div>
      <div class="reschedule-group" role="group" [attr.aria-labelledby]="formId + '-from'">
        <span class="reschedule-legend" [id]="formId + '-from'">Schedule next task from</span>
        <div class="reschedule-options">
          <label class="check-label reschedule-option">
            <input
              type="radio"
              name="from"
              value="COMPLETION"
              [ngModel]="from()"
              (ngModelChange)="from.set($event)"
            />
            When I complete this task
          </label>
          <label class="check-label reschedule-option">
            <input
              type="radio"
              name="from"
              value="DUE_DATE"
              [ngModel]="from()"
              (ngModelChange)="from.set($event)"
            />
            The scheduled due date
          </label>
        </div>
        <p class="reschedule-note">
          The next task will be due {{ interval() }} {{ unitName(unit()) }} after
          {{
            from() === 'COMPLETION'
              ? 'you complete this one.'
              : 'its scheduled due date, even if you finish early or late.'
          }}
        </p>
      </div>
    }
  </form>
  <div dialogActions>
    <button type="button" class="button-secondary button-sm" (click)="close()">Cancel</button>
    <button
      type="submit"
      [attr.form]="formId"
      class="button-primary button-sm"
      [disabled]="!valid()"
    >
      Save changes
    </button>
  </div>
</bt-dialog>
