<button
  type="button"
  btIconButton
  [icon]="icon()"
  [label]="label()"
  [variant]="variant()"
  [size]="size()"
  [disabled]="disabled()"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.popovertarget]="panelId"
></button>
<div
  #panel
  class="menu-panel"
  popover
  role="menu"
  [id]="panelId"
  [attr.aria-label]="label()"
  (beforetoggle)="beforeToggle($event)"
  (toggle)="toggled($event)"
  (keydown)="move($event)"
  (click)="close()"
>
  <ng-content />
</div>
