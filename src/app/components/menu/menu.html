<button
  #trigger
  type="button"
  btIconButton
  [icon]="icon()"
  [label]="label()"
  [variant]="variant()"
  [disabled]="disabled()"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
></button>
@if (open()) {
  <div
    #panel
    class="menu-panel"
    role="menu"
    [attr.aria-label]="label()"
    (keydown)="move($event)"
    (click)="close()"
  >
    <ng-content />
  </div>
}
