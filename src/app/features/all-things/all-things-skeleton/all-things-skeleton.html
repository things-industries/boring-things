<div class="all-things-skeleton" aria-hidden="true">
  <div class="skeleton-categories">
    @for (category of categories; track category) {
      <div class="skeleton-chip"></div>
    }
  </div>
  <div>
    @for (thing of things; track thing) {
      <div class="skeleton-row">
        <div class="skeleton-thumbnail"></div>
        <div class="skeleton-lines"><span></span><span></span></div>
      </div>
    }
  </div>
</div>
<span class="visually-hidden" role="status">Loading your things…</span>
