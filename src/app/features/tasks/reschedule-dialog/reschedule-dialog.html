<bt-dialog title="Reschedule task" [open]="!!task()" (closed)="close()">
  <form [id]="formId" class="reschedule-form" (ngSubmit)="save()">
    <label class="reschedule-field"
      >Next due date
      <input
        name="date"
        type="date"
        required
        [ngModel]="date()"
        (ngModelChange)="date.set($event)"
      />
    </label>
    <label class="reschedule-field"
      >Repeats
      <select name="repeats" [ngModel]="repeats()" (ngModelChange)="repeats.set($event)">
        <option [ngValue]="false">Once</option>
        <option [ngValue]="true">Repeats</option>
      </select>
    </label>
    @if (repeats()) {
      <fieldset class="reschedule-interval">
        <legend>Every</legend>
        <input
          name="interval"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          required
          aria-label="Number"
          [ngModel]="interval()"
          (ngModelChange)="interval.set($event)"
        />
        <select name="unit" aria-label="Unit" [ngModel]="unit()" (ngModelChange)="unit.set($event)">
          <option value="DAY">{{ interval() === 1 ? 'day' : 'days' }}</option>
          <option value="WEEK">{{ interval() === 1 ? 'week' : 'weeks' }}</option>
          <option value="MONTH">{{ interval() === 1 ? 'month' : 'months' }}</option>
          <option value="YEAR">{{ interval() === 1 ? 'year' : 'years' }}</option>
        </select>
      </fieldset>
    }
  </form>
  <div dialogActions>
    <button type="button" class="button-secondary button-sm" (click)="close()">Cancel</button>
    <button
      type="submit"
      [attr.form]="formId"
      class="button-primary button-sm"
      [disabled]="!valid()"
    >
      Save
    </button>
  </div>
</bt-dialog>
