<bt-placeholder-page [title]="'profile' | term" icon="openProfile" back="/">
  <h2>Coming soon</h2>
  @if (profile()?.displayName; as name) {
    <p>Signed in as {{ name }}</p>
  }
  <p class="text-primary-muted">Account settings will appear here.</p>
  <button type="button" class="button-secondary" (click)="auth.signOut()">Sign out</button>
</bt-placeholder-page>
